<!DOCTYPE html>
<html lang="en-IN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Farmreach Technologies — India's Agricultural Operating Systems &amp; Transformation Company</title>
  <meta name="description" content="Farmreach Technologies combines agricultural operating expertise, technology, data and transformation consulting to help governments and enterprises design, build and operate agricultural systems at scale.">
  <link rel="canonical" href="https://farmreach.in/">
  <meta name="theme-color" content="#016F3B">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Farmreach Technologies">
  <meta property="og:title" content="Farmreach Technologies — India's Agricultural Operating Systems &amp; Transformation Company">
  <meta property="og:description" content="We build the systems that make agriculture work.">
  <meta property="og:url" content="https://farmreach.in/">
  <meta property="og:image" content="https://farmreach.in/assets/img/farmreach-og.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@farmreach">
  <script>
    /* Set the theme before first paint. Default is light; a stored choice wins. */
    (function () {
      try {
        var s = localStorage.getItem('farmreach-theme');
        document.documentElement.setAttribute('data-theme', (s === 'light' || s === 'dark') ? s : 'light');
      } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
    })();
  </script>
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/assets/img/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="/assets/img/favicon-16.png" sizes="16x16" type="image/png">
  <link rel="icon" href="/assets/img/favicon-48.png" sizes="48x48" type="image/png">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png" sizes="180x180">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="apple-mobile-web-app-title" content="Farmreach">
  <meta name="application-name" content="Farmreach Technologies">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;500;600;700;800&display=swap">
</head>
<body>
  <div id="root"><!--app-html--></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
